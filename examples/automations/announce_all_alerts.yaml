# Automation: speak every Bus Monitor alert on Google Home / Nest speakers.
# Settings > Automations & scenes > Create automation > Create new automation,
# then the top-right menu > Edit in YAML, and replace everything with this.
# Change: entity_id (your TTS entity) and media_player_entity_id (your speakers).
alias: Bus alerts on speakers
description: Speaks each bus alert.
mode: queued
triggers:
  - trigger: event
    event_type: bus_monitor_alert
actions:
  - action: tts.speak
    target:
      entity_id: tts.google_translate_en_com
    data:
      media_player_entity_id: media_player.kitchen_speaker
      message: "{{ trigger.event.data.message }}"
